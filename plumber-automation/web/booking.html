<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Plumber — Rapid Response Plumbing</title>
<style>
  :root {
    --ink: #14181f;
    --muted: #5f6874;
    --line: #dfe3e8;
    --bg: #f2f4f7;
    --card: #ffffff;
    --accent: #1a56db;
    --accent-ink: #ffffff;
    --danger: #b42318;
    --ok: #067647;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8eaed; --muted: #9aa3af; --line: #2c323b;
      --bg: #14181f; --card: #1b2029; --accent: #4d82f3; --danger: #f97066; --ok: #47cd89;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 620px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 32px;
  }
  h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.01em; }
  .sub { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
  fieldset { border: none; padding: 0; margin: 0 0 24px; }
  legend {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 600; padding: 0; margin-bottom: 12px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  label { display: block; margin-bottom: 14px; font-size: 13px; font-weight: 500; }
  label span.req { color: var(--danger); }
  input, select, textarea {
    width: 100%; margin-top: 5px; padding: 10px 12px; font: inherit; font-size: 14px;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 7px;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 84px; }
  .consent {
    display: flex; gap: 11px; align-items: flex-start;
    background: color-mix(in srgb, var(--accent) 6%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: 8px; padding: 14px; font-size: 13px; line-height: 1.5;
  }
  .consent input { width: auto; margin: 2px 0 0; flex-shrink: 0; }
  .consent label { margin: 0; font-weight: 400; }
  button {
    width: 100%; padding: 13px; font: inherit; font-size: 15px; font-weight: 600;
    color: var(--accent-ink); background: var(--accent);
    border: none; border-radius: 8px; cursor: pointer; margin-top: 8px;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .55; cursor: progress; }
  #result { margin-top: 20px; padding: 14px; border-radius: 8px; font-size: 14px; display: none; }
  #result.ok { display: block; background: color-mix(in srgb, var(--ok) 12%, transparent); border: 1px solid var(--ok); }
  #result.err { display: block; background: color-mix(in srgb, var(--danger) 10%, transparent); border: 1px solid var(--danger); }
  #result ul { margin: 8px 0 0; padding-left: 20px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .endpoint {
    margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  .endpoint code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .endpoint input { font-size: 12px; padding: 7px 9px; font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div class="card">
  <h1>Book a plumber</h1>
  <p class="sub">Tell us what's wrong and when suits you. We'll confirm by text and email straight away.</p>

  <form id="booking">
    <fieldset>
      <legend>Your details</legend>
      <label>Full name <span class="req">*</span>
        <input name="full_name" required autocomplete="name" placeholder="Dana Reyes">
      </label>
      <div class="row">
        <label>Email <span class="req">*</span>
          <input name="email" type="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label>Mobile <span class="req">*</span>
          <input name="phone" type="tel" required autocomplete="tel" placeholder="(512) 555-1234">
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Where</legend>
      <label>Street address <span class="req">*</span>
        <input name="address_line" required autocomplete="address-line1" placeholder="4412 Red Oak Lane">
      </label>
      <div class="row">
        <label>City
          <input name="city" autocomplete="address-level2" value="Austin">
        </label>
        <div class="row" style="gap:14px">
          <label>State
            <input name="state" autocomplete="address-level1" value="TX" maxlength="2">
          </label>
          <label>ZIP
            <input name="postal_code" autocomplete="postal-code" value="78745">
          </label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>What's the job</legend>
      <div class="row">
        <label>Service needed <span class="req">*</span>
          <select name="job_type" required>
            <option value="leak_repair">Leak repair</option>
            <option value="drain_cleaning">Drain cleaning</option>
            <option value="water_heater" selected>Water heater</option>
            <option value="tankless_install">Tankless install</option>
            <option value="gas_line">Gas line</option>
            <option value="sewer_line">Sewer line</option>
            <option value="repipe">Repipe</option>
            <option value="fixture_install">Fixture install</option>
            <option value="backflow_test">Backflow test</option>
            <option value="emergency_burst">Burst pipe (emergency)</option>
          </select>
        </label>
        <label>How urgent
          <select name="urgency">
            <option value="emergency">Emergency — today</option>
            <option value="standard" selected>Standard — within a few days</option>
            <option value="flexible">Flexible — any time</option>
          </select>
        </label>
      </div>
      <label>Describe the problem
        <textarea name="description" placeholder="No hot water since yesterday. Heater is about 11 years old and there's a small puddle underneath."></textarea>
      </label>
      <div class="row">
        <label>Preferred date <span class="req">*</span>
          <input name="preferred_date" type="date" required>
        </label>
        <label>Preferred window
          <select name="preferred_window">
            <option value="08:00-12:00" selected>Morning (8am – 12pm)</option>
            <option value="12:00-16:00">Afternoon (12pm – 4pm)</option>
            <option value="16:00-20:00">Evening (4pm – 8pm)</option>
          </select>
        </label>
      </div>
    </fieldset>

    <!--
      LEGALLY LOAD-BEARING. Do not remove, pre-tick, or bury this.
      Express written consent is what makes appointment SMS lawful under the
      TCPA, and A2P 10DLC registration asks you to show the exact wording and
      where it appears. The server rejects any booking without it.
    -->
    <div class="consent">
      <input type="checkbox" id="sms_consent" name="sms_consent" required>
      <label for="sms_consent">
        Text me about this appointment. I agree to receive appointment confirmations,
        reminders and arrival notices from Rapid Response Plumbing at the number above.
        Message and data rates may apply. Reply STOP to opt out at any time.
      </label>
    </div>

    <button type="submit" id="submit">Book my appointment</button>
  </form>

  <div id="result"></div>

  <div class="endpoint">
    Posting to <code id="endpoint-label"></code>
    <input id="endpoint" value="http://localhost:5678/webhook/booking">
    <div class="hint">Change this if n8n is running elsewhere. Use <code>/webhook-test/booking</code> while the workflow is open in the n8n editor.</div>
  </div>
</div>

<script>
  // Default the date field to tomorrow — nobody books a plumber for yesterday.
  const tomorrow = new Date(Date.now() + 86400000);
  document.querySelector('[name=preferred_date]').value = tomorrow.toISOString().slice(0, 10);

  const endpointInput = document.getElementById('endpoint');
  const endpointLabel = document.getElementById('endpoint-label');
  const syncLabel = () => { endpointLabel.textContent = endpointInput.value; };
  endpointInput.addEventListener('input', syncLabel);
  syncLabel();

  const form = document.getElementById('booking');
  const result = document.getElementById('result');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submit.disabled = true;
    submit.textContent = 'Booking…';
    result.className = '';
    result.textContent = '';

    const data = Object.fromEntries(new FormData(form));
    data.sms_consent = form.sms_consent.checked;

    try {
      const res = await fetch(endpointInput.value, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(data),
      });
      const body = await res.json().catch(() => ({}));

      if (res.ok && body.ok !== false) {
        result.className = 'ok';
        result.innerHTML =
          '<strong>You\'re booked.</strong><br>Check your phone and email for confirmation.' +
          (body.jobId ? '<br><span style="font-size:12px;opacity:.75">Job ' + body.jobId + '</span>' : '');
        form.reset();
      } else {
        result.className = 'err';
        const errors = body.errors || [body.error || ('HTTP ' + res.status)];
        result.innerHTML = '<strong>We couldn\'t book that:</strong><ul>' +
          errors.map((x) => '<li>' + String(x).replace(/[<>]/g, '') + '</li>').join('') + '</ul>';
      }
    } catch (err) {
      result.className = 'err';
      result.innerHTML = '<strong>Could not reach the booking service.</strong><br>' +
        '<span style="font-size:13px">' + err.message + ' — is n8n running, and is workflow 01 active?</span>';
    } finally {
      submit.disabled = false;
      submit.textContent = 'Book my appointment';
    }
  });
</script>
</body>
</html>
